[project]
name = "botta-backend"
version = "0.1.0"
description = "Python API and content validation for botta.in"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
ingest = ["pypdf>=5,<7"]
test = ["httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
